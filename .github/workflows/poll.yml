name: Poll for application openings

# Every 30 minutes. Vercel's free tier caps cron at once per day, which cannot
# support "opened 20 minutes ago", so the schedule lives here instead.
#
# Running the script directly rather than calling a web endpoint means there is
# no public trigger URL to secure.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/poll.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
